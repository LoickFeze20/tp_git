repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: '\.ipynb$'

  - repo: local
    hooks:
      - id: check-notebook-has-read
        name: Verifie pd.read_ + train_test_split + .fit( dans le notebook
        entry: python hooks/check_notebook.py
        language: python
        files: '\.ipynb$'
        additional_dependencies: [nbformat]
